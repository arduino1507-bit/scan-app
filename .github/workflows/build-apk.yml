name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Install dependencies & Build Web
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-mlkit/barcode-scanning --legacy-peer-deps
          npm install --legacy-peer-deps
          npm run build

      - name: Setup Capacitor Android
        run: |
          npx cap init "BarcodeScanner" "com.scanapp" --web-dir dist
          npx cap add android
          # Разрешения на камеру, вспышку и виброотклик
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.FLASHLIGHT" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          # Включение аппаратного модуля распознавания Google ML Kit
          sed -i '/<application/a \        <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode" \/>' android/app/src/main/AndroidManifest.xml

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
